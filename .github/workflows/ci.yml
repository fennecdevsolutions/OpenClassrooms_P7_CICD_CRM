name: Orion CRM - Continuous Integration

on:
  push:
    branches:
      - '**'                  
  pull_request:
    branches:
      - 'main'     
      
permissions:
  checks: write      # For tabs and test reports creation
  pull-requests: write # For display on Pull Requests
  contents: read   

jobs:
  # ===============================
  # Backend : COMPILATION AND TESTS
  # ===============================
  build-and-test-backend:
    runs-on: ubuntu-latest
    steps: # install, build & test, provide reports as artefacts

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 #Get all commits history

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Backend Build & Test
        run: |
          cd back
          chmod +x gradlew
          ./gradlew clean test

      - name: Archive backend test report as artefact
        uses: actions/upload-artifact@v4
        if: always() # To upload even when the tests fail
        with:
          name: backend-test-results
          path: back/build/reports/tests/test/

      - name: Display backend test reports on Github Actions
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend test reports
          path: back/build/test-results/test/*.xml
          reporter: java-junit

  # ======================================
  # Backend : SonarQube Quality & Security
  # ======================================

      - name: SonarQube Cloud Analysis (Backend)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd back
          ./gradlew sonar


  # ===============================
  # Frontend : COMPILATION AND TESTS
  # ===============================

  build-and-test-frontend:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend Build & Test
        run: |
          cd front
          npm ci
          npm run test:ci

      - name: Archive frontend test report as artefact
        uses: actions/upload-artifact@v4
        if: always() # To upload even when the tests fail
        with:
          name: frontend-coverage-results
          path: front/coverage/microcrm/

      - name: Display frontend test reports on Github Actions
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Frontend test reports
          path: front/coverage/microcrm/TESTS-results.xml
          reporter: java-junit

  # ======================================
  # Frontend : SonarQube Quality & Security
  # ======================================

      - name: SonarQube Cloud Analysis (Frontend)
        uses: sonarsource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: front