name: Orion CRM - Continuous Integration

on:
  push:
    branches:
      - '**'                  
  pull_request:
    branches:
      - 'main'     
      
permissions:
  checks: write      # For tabs and test reports creation
  pull-requests: write # For display on Pull Requests
  contents: read
  packages: write # for GHCR images creation   

jobs:
  # ===============================
  # Backend : COMPILATION AND TESTS
  # ===============================
  build-and-test-backend:
    runs-on: ubuntu-latest
    steps: # install, build & test, provide build & reports as artefacts
      - uses: actions/checkout@v6

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Backend Build & Test
        run: |
          cd back
          chmod +x gradlew
          ./gradlew clean test
          ./gradlew bootJar --no-daemon

      - name: Upload Backend JAR Artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar 
          path: back/build/libs/*.jar 
          if-no-files-found: error # Stops pipeline if Jar is not found

      - name: Archive backend build & test reports as artefact
        uses: actions/upload-artifact@v7
        if: always() # To upload even when the tests fail
        with:
          name: backend-test-results
          path: back/build/  

      - name: Display backend test reports on Github Actions
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Backend test reports
          path: back/build/test-results/test/*.xml
          reporter: java-junit


  build-and-test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Installer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Frontend Build & Test
        run: |
          cd front
          npm ci
          npm run build
          npm run test:ci

      - name: Upload Frontend Dist Artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist 
          path: front/dist/microcrm 
          if-no-files-found: error  # Stops pipeline if no files 

      - name: Archive frontend test report as artefact
        uses: actions/upload-artifact@v7
        if: always() # To upload even when the tests fail
        with:
          name: frontend-coverage-results
          path: front/coverage/microcrm/

      - name: Display frontend test reports on Github Actions
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Frontend test reports
          path: front/coverage/microcrm/TESTS-results.xml
          reporter: java-junit

  # ======================================
  # SonarQube Quality & Security Analysis
  # ======================================
  sonar-analysis:
    runs-on: ubuntu-latest
    needs: [build-and-test-backend, build-and-test-frontend] # Awaits build and test jobs to finish
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Installer Java 17 (Requis pour exécuter le scanner Sonar)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Download backend build & reports
      - name: Download Backend Build Artifacts
        uses: actions/download-artifact@v8
        with:
          name: backend-test-results
          path: back/build/

      # Download frontend reports
      - name: Download Frontend Coverage Artifacts
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage-results
          path: front/coverage/microcrm/

      # Launch global project scan (back & front)
      - name: Run Global SonarQube Analysis
        uses: sonarsource/sonarcloud-github-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  # ====================================================
  # CD : Publish images to Gitgub Container Registry
  # ====================================================
  push-to-ghcr:
    name: Build & Push to GHCR
    needs: [sonar-analysis] # awaits for sonar analysis job
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # runs only on main
    
    steps:
      - uses: actions/checkout@v6

      # Repo name to lowercase (GHCR rule)
      - name: Lowercase repository name
        id: string
        run: echo "repo_lowercase=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Connexion to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }} 
          password: ${{ secrets.GITHUB_TOKEN }} 

      # Build & Publish Backend image
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: backend
          push: true
          tags: |
            ghcr.io/${{ steps.string.outputs.repo_lowercase }}/orion-backend:latest
            ghcr.io/${{ steps.string.outputs.repo_lowercase }}/orion-backend:${{ github.sha }}

      # Build & Publish Frontend image
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: frontend
          push: true
          tags: |
            ghcr.io/${{ steps.string.outputs.repo_lowercase }}/orion-frontend:latest
            ghcr.io/${{ steps.string.outputs.repo_lowercase }}/orion-frontend:${{ github.sha }}