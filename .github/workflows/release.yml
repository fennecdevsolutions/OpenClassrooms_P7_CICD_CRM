name: Orion CRM - Automated Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # Pipeline activation on tags SemVer (MAJOR.MINOR.PATCH)

permissions:
  contents: write 

jobs:
  generate-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v6

      # ====================================================
      # 1. Compilation
      # ====================================================
      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Backend Build JAR
        run: |
          cd back
          chmod +x gradlew
          ./gradlew clean bootJar --no-daemon

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Frontend Build Production
        run: |
          cd front
          npm ci
          npm run build

      # Zipper le dossier dist du frontend pour l'attacher proprement à la release
      - name: Archive Frontend Dist
        run: |
          cd front/dist/microcrm
          zip -r ../../../frontend-dist-${{ github.ref_name }}.zip .

      # Préparer et renommer le JAR du backend pour la clarté de la release
      - name: Prepare Backend JAR
        run: cp back/build/libs/*.jar ./backend-orion-${{ github.ref_name }}.jar

      # ====================================================
      # 2. CRÉATION AUTOMATIQUE DE LA RELEASE GITHUB
      # ====================================================
      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
          generate_release_notes: true # Génère AUTOMATIQUEMENT le changelog à partir des messages de commits !
          files: |
            backend-orion-${{ github.ref_name }}.jar
            frontend-dist-${{ github.ref_name }}.zip